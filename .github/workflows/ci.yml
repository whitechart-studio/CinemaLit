name: CinemaLit Studio CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: cinemalit
          CLICKHOUSE_USER: cinemalit
          CLICKHOUSE_PASSWORD: cinemagic2026

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . PyJWT python-dotenv requests google-genai pytest

      - name: Seed ClickHouse Schema
        run: |
          sleep 3
          python3 -c "
          import urllib.request, base64
          creds = base64.b64encode(b'cinemalit:cinemagic2026').decode()
          with open('scripts/setup_clickhouse_schema.sql') as f:
              content = f.read()
          lines = [l for l in content.splitlines() if not l.strip().startswith('--')]
          clean_content = '\n'.join(lines)
          for stmt in clean_content.split(';'):
              if stmt.strip():
                  req = urllib.request.Request('http://localhost:8123/?database=cinemalit', data=stmt.strip().encode('utf-8'), headers={'Authorization': f'Basic {creds}'})
                  urllib.request.urlopen(req)
          "

      - name: Run Director Workflow Integration Test
        run: |
          python scripts/test_director_flow.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build Web App
        run: |
          cd cinemalit-studio
          npm ci || npm install
          npm run build
